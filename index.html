function revenueSetMetric(key,value,formatter=revenueUSD){
 const node=document.querySelector(`[data-live="${key}"]`);
 if(!node)return;
 if(typeof value!=='number'||!Number.isFinite(value)){node.textContent=String(value);revenueAnimated.delete('metric:'+key);return;}
 const id='metric:'+key,old=revenueAnimated.get(id);
 if(!revenueMotion()){node.textContent=formatter(value);revenueAnimated.delete(id);return;}
 const raw=node.textContent.replace(/[^0-9.-]/g,'');const parsed=raw?Number(raw):NaN;
 const shown=old?.value??(Number.isFinite(parsed)?parsed:value);
 revenueAnimated.set(id,{type:'number',node,value:shown,target:value,format:formatter});
 if(!old)node.textContent=formatter(shown);
}
function revenueSetBar(index,value,scale){
 const node=document.querySelector(`[data-live-bar="${index}"]`);if(!node)return;
 const key='bar:'+index,old=revenueAnimated.get(key);
 const parsed=Number(node.dataset.value);
 const shown=old?.value??(Number.isFinite(parsed)?parsed:value);
 revenueAnimated.set(key,{type:'bar',node,value:shown,target:value,scale});
}
function revenuePaintBar(entry){
 const value=entry.value, size=Math.min(66,Math.abs(value)/Math.max(1,entry.scale)*66);
 entry.node.dataset.value=String(value);
 entry.node.setAttribute('y',String(value>=0?90-size:90));
 entry.node.setAttribute('height',String(Math.max(0.05,size)));
 entry.node.setAttribute('fill',value>=0?'var(--ok)':'var(--bd)');
 entry.node.querySelector('title')?.replaceChildren(document.createTextNode(revenueUSD(value)));
}
function revenueTick(now){
 revenueFrame=0;
 if(!document.getElementById('revenue-live-page') && page!=='ins'){revenueAnimated.clear();return;}
 const dt=revenueLast?Math.min(64,now-revenueLast):16;revenueLast=now;
 const alpha=revenueMotion()?1-Math.exp(-dt/165):1;
 let running=false;
 for(const [key,entry] of revenueAnimated){
  if(!entry.node.isConnected){revenueAnimated.delete(key);continue;}
  const gap=entry.target-entry.value;
  if(Math.abs(gap)<Math.max(.004,Math.abs(entry.target)*.00008))entry.value=entry.target;
  else{entry.value+=gap*alpha;running=true;}
  if(entry.type==='number'){const text=entry.format(entry.value);if(entry.node.textContent!==text)entry.node.textContent=text;}
  else revenuePaintBar(entry);
 }
 if(running)revenueFrame=requestAnimationFrame(revenueTick);
 else{revenueLast=0;revenueAnimated.clear();}
}
function revenueScheduleFrame(){if(!revenueFrame)revenueFrame=requestAnimationFrame(revenueTick)}

["Account and data","How do I back up an entire workspace?","Open Data & Deployment and use the available JSON backup/export option. Keep the downloaded file secure. Restore only files you trust and check which workspace will be affected before importing."],
["Account and data","What happens if I open the website in a different browser or device?","Workspaces stay in the browser where you created them. Open the same browser (or restore a backup from Data & Deployment) to continue on another device."],
["Account and data","Does Decision Ledger currently support Microsoft Entra ID or single sign-on?","Not yet. Microsoft Entra ID, SAML/OIDC sign-in, centralised enterprise user provisioning and conditional access require a production backend and integrations."],
["Account and data","Is this prototype suitable for confidential enterprise records?","Not as deployed. Local browser storage is not an enterprise security boundary. Use sample or non-sensitive information until encryption, authentication, server-side access controls, retention, monitoring and compliance measures are implemented and assessed."],
["Support","How can I find a feature without searching every menu?","Use the five main navigation areas and the contextual More tools menu. The command palette also provides quick access to supported pages and locally saved decisions."],
["Support","Can I use the website on a phone or tablet?","The interface includes mobile layouts and accessible controls, but functionality and visual behaviour should still be tested on your specific browser and device."],
["Support","Can I reduce animations and motion?","Yes. If your operating system or browser requests reduced motion, Decision Ledger limits decorative animations and skips long chapter transitions."],["Support","How do I host Decision Ledger on the web?","Publish the single HTML file on a static host. GitHub Pages (pages.github.com), Netlify Drop (app.netlify.com/drop), and Cloudflare Pages all work. Rename the file to index.html for the site root. See Data & Deployment for quick links."]
);

function dependsCycle(from,to){
 const edges=office().links.map(x=>[x.from,x.to]);
 edges.push([from,to]);const seen=new Set(),stack=[to];
 while(stack.length){const cur=stack.pop();if(cur===from)return true;if(seen.has(cur))continue;seen.add(cur);edges.filter(([a])=>a===cur).forEach(([,b])=>stack.push(b));}
 return false;

// === Smooth SPA navigation: avoid full chrome rebuild & flash on page change ===
(function(){
  let lastAreaId = null;
  let lastPage = null;
  let navBuilt = false;
  let transitioning = false;
  let forceChrome = false;

  window.dlForceChrome = function(){ forceChrome = true; };

  function updateNavHighlights(){
    const area = typeof navAreaFor === 'function' ? navAreaFor(page) : null;
    const areaId = area ? area.id : null;
    document.querySelectorAll('#nav .nav-primary').forEach(btn=>{
      const id = btn.getAttribute('data-navarea');
      if(id === areaId) btn.setAttribute('aria-current','location');
      else btn.removeAttribute('aria-current');
    });
    // module links
    document.querySelectorAll('.module-link').forEach(btn=>{
      if(btn.getAttribute('data-p') === page) btn.setAttribute('aria-current','page');
      else btn.removeAttribute('aria-current');
    });
    // legacy flat nav
    document.querySelectorAll('#nav .nv[data-p]').forEach(btn=>{
      if(btn.classList.contains('nav-primary')) return;
      if(btn.getAttribute('data-p') === page) btn.setAttribute('aria-current','page');
      else btn.removeAttribute('aria-current');
    });
  }

  function buildModuleTopnav(main){
    const area = typeof navAreaFor === 'function' ? navAreaFor(page) : null;
    if(!area || area.id === 'overview') return;
    const accessible = area.pages.filter(p=>PG[p]);
    const visibleCount = window.innerWidth <= 820 ? 2 : 4;
    const mainTabs = accessible.slice(0, visibleCount);
    const overflow = accessible.slice(visibleCount);
    const selectedOverflow = overflow.includes(page);
    const tabHTML = `<div class="module-topnav"><div class="module-path"><span>DECISION LEDGER</span><span class="sep">/</span><span>${esc(area.title)}</span><span class="sep">/</span><span class="active">${esc(NAV_SHORT[page]||PG[page]?.[0]||page)}</span></div><nav class="module-links" aria-label="${esc(area.title)} tools">${mainTabs.map(subNavItem).join('')}${overflow.length?`<details class="module-more" ${selectedOverflow?'aria-current="page"':''}><summary aria-label="More ${esc(area.title)} tools">More tools</summary><div class="module-more-list">${overflow.map(subNavItem).join('')}</div></details>`:''}</nav></div>`;
    main.insertAdjacentHTML('afterbegin', tabHTML);
  }

  function renderMainContent(){
    const main = document.getElementById('main');
    if(!main || !PG[page]) return;
    const html = PG[page][1]();
    main.innerHTML = html;
    const area = typeof navAreaFor === 'function' ? navAreaFor(page) : null;
    if(area && area.id !== 'overview') buildModuleTopnav(main);
    // settings workspace card injection from earlier override
    if(page === 'set' && typeof wsSettings === 'function'){
      try{ main.insertAdjacentHTML('beforeend', wsSettings()); }catch(e){}
    }
    main.classList.remove('dl-page-exit');
    main.classList.remove('dl-page-enter');
    void main.offsetWidth;
    main.classList.add('dl-page-enter');
  }

  const prevDraw = draw;
  draw = function(opts){
    opts = opts || {};
    const area = typeof navAreaFor === 'function' ? navAreaFor(page) : null;
    const areaId = area ? area.id : null;
    const pageChanged = lastPage !== page;
    const areaChanged = lastAreaId !== areaId;
    const needFullChrome = forceChrome || !navBuilt || opts.full || areaChanged;

    document.querySelector('.app')?.classList.toggle('mini', !!mini);

    if(needFullChrome){
      // Full chrome rebuild (workspace switch, first paint, area change)
      prevDraw();
      // prevDraw already wrote main; ensure module topnav path is correct (final override also did)
      navBuilt = true;
      forceChrome = false;
    } else if(pageChanged){
      // Soft page transition: keep nav + header, only swap main with fade
      updateNavHighlights();
      // Update org label if sample flag changed
      const org = document.querySelector('#top .org');
      if(org && typeof o === 'function'){
        const name = o().name;
        org.innerHTML = (typeof logoHTML==='function'?logoHTML():'') + (name ? esc(name) + (S.demo ? ' · sample data' : '') : 'Local workspace');
      }
      // Update notification dot without full top rebuild
      const n = typeof notes === 'function' ? notes() : [];
      const bell = document.querySelector('#top [data-a="bell"]');
      if(bell){
        let dot = bell.querySelector('.dot');
        if(n.length){
          if(!dot){ dot = document.createElement('i'); dot.className = 'dot'; bell.appendChild(dot); }
          dot.textContent = n.length;
        } else if(dot){ dot.remove(); }
      }

      const main = document.getElementById('main');
      if(main){
        if(transitioning || matchMedia('(prefers-reduced-motion: reduce)').matches){
          renderMainContent();
        } else {
          transitioning = true;
          main.classList.add('dl-page-exit');
          const done = ()=>{
            main.removeEventListener('transitionend', done);
            renderMainContent();
            transitioning = false;
          };
          main.addEventListener('transitionend', done);
          // fallback if transitionend doesn't fire
          setTimeout(done, 160);
        }
      }
    } else {
      // Same page re-draw (data change): refresh main only, no animation flash
      updateNavHighlights();
      const main = document.getElementById('main');
      if(main && PG[page]){
        const html = PG[page][1]();
        main.innerHTML = html;
        if(area && area.id !== 'overview') buildModuleTopnav(main);
        if(page === 'set' && typeof wsSettings === 'function'){
          try{ main.insertAdjacentHTML('beforeend', wsSettings()); }catch(e){}
        }
      }
    }

    lastPage = page;
    lastAreaId = areaId;
  };

  // When workspace switches or major state changes, force chrome rebuild
  const _wsSwitch = typeof wsSwitch === 'function' ? wsSwitch : null;
  if(_wsSwitch){
    window.wsSwitch = function(id){
      forceChrome = true;
      return _wsSwitch(id);
    };
  }

  // Theme toggle should not rebuild whole page content harshly
  document.addEventListener('click', function(e){
    const t = e.target.closest('[data-a="tgl"],[data-th]');
    if(!t) return;
    // allow default handler; just mark that we don't need content flash
  }, true);
})();

document.addEventListener('submit', function(ev){
  const form = ev.target.closest('#dl-feedback');

  const email = String(fd.get('email')||'').trim();
  const message = String(fd.get('message')||'').trim();
  const status = document.getElementById('dl-feedback-status');
  if(!message){
    if(status) status.textContent = 'Please enter a short message.';
    return;
  }
  const body = [
    message,
    '',
    '---',
    email ? 'From: '+email : 'From: (not provided)',
    'Page: '+(location.href||''),
    'Workspace: '+((typeof o==='function' && o()?.name) || 'none'),
    'User agent: '+(navigator.userAgent||'')
  ].join('\\n');
  const href = 'mailto:feedback@decisionledger.app?subject='+encodeURIComponent('Decision Ledger feedback')+'&body='+encodeURIComponent(body);
  if(status) status.textContent = 'Opening your email app…';
  try{ window.location.href = href; }catch(e){ if(status) status.textContent = 'Could not open email. Write to feedback@decisionledger.app instead.'; }
  setTimeout(function(){ if(status) status.textContent = 'If your email app did not open, write to feedback@decisionledger.app.'; }, 2500);
}, true);
